name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04-arm
            python-version: "3.15"
          - os: xcode-27
            python-version: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: laputa-systems/buildlib/setup@4ed2e0a1e0a5d23911ffccdd97349d30a7885f01 # v0.3.2
        with:
          tools: cpython
          lock: .github/tools.lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync

      - name: Lint and type-check
        run: make check

      - name: Test
        run: make test

      - name: Start-method smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pytest tests/test_campaign.py -q --serial -k "start_methods or collection_mismatch"
